# Bronze-layer job definitions. Targets, variables, the workspace host and
# the run-as service principal all live in the root databricks.yml - this
# file contributes resources only, so the layers can never be deployed
# against mismatched settings.
#
# Paths below are relative to THIS FILE's directory (bronze_layer/resources/),
# not to the bundle root - hence the leading `../`. Verified against
# Databricks CLI v1.9.0: bundle-root-relative paths here resolve as
# bronze_layer/resources/<path> and fail with "notebook ... not found".

resources:
  jobs:
    # bronze_orders_ingestion: commented out (not deleted) - was a sample/
    # test job for the single-table ingestion path, validated during
    # development. Kept here as reference for anyone building a similar
    # single-table job, but disabled to avoid unnecessary deployment/
    # scheduling cost. Uncomment and redeploy if needed again.
    # bronze_orders_ingestion:
    #   name: bronze_orders_ingestion

    #   environments:
    #     - environment_key: default
    #       spec:
    #         client: "3"
    #         dependencies:
    #           - ../dist/*.whl

    #   tasks:
    #     - task_key: ingest_orders
    #       environment_key: default

    #       notebook_task:
    #         notebook_path: ../notebooks/run_ingestion.py
    #         base_parameters:
    #           config_path: ${workspace.file_path}/bronze_layer/config/order_bronze.yaml
    #           batch_id: "{{job.run_id}}"
    #           run_id: "{{job.id}}-{{job.run_id}}"

    #   email_notifications:
    #     on_failure:
    #       - ${var.notification_email}

    # Directory ingestion: loads every .json in source_dir into its own
    # bronze table named {filename}_bronze. Run with:
    #   databricks bundle run bronze_directory_ingestion
    bronze_directory_ingestion:
      name: bronze_directory_ingestion
      # max_concurrent_runs: 1

      # Serverless compute rejects a task-level `libraries:` field outright
      # ("Libraries field is not supported for serverless task, please
      # specify libraries in environment", 400 INVALID_PARAMETER_VALUE).
      # Dependencies for serverless are declared as a job-level environment
      # that tasks bind to via `environment_key`. This workspace is
      # serverless by design - see azure_setup.md Step 3, chosen because
      # trial subscriptions have a hard 4-vCPU quota that blocks classic
      # compute entirely.
      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              # The wheel built and uploaded by the root bundle's
              # `artifacts:` block, so the notebook can
              # `from bronze_ingest import ...` with no sys.path
              # manipulation. Path is relative to this file (see header).
              - ../dist/*.whl

      tasks:
        - task_key: ingest_directory
          environment_key: default

          notebook_task:
            # Relative to this file's directory (see header). The bundle
            # syncs the notebook into the target's own root_path, so the
            # deployed path differs per environment and belongs to no
            # individual user.
            notebook_path: ../notebooks/run_directory_ingestion.py
            base_parameters:
              source_dir: ${var.source_volume_path}
              catalog: ${var.catalog}
              schema_name: ${var.schema_name}
              table_name_template: "{filename}_bronze"
              write_mode: append
              multiline: "true"
              max_files: "50"
              stop_on_error: "false"
              # Data quality: applied to every file unless overridden below.
              required_columns: ""                  # e.g. "order_id" or "order_id,customer_id"
              fail_on_quality_error: "false"        # false = quarantine bad rows, keep loading
              # Per-file overrides as a JSON string (filename -> IngestionConfig fields):
              per_file_config_json: >-
                {"orders_quarantine_test.json": {"required_columns": ["order_id"]}}
              # Ties every audit row and idempotent batch write (#63) in this
              # run back to this specific job run instead of fuzzy timestamp
              # matching (#52).
              batch_id: "{{job.run_id}}"
              run_id: "{{job.id}}-{{job.run_id}}"

          # No `libraries:` here - see the `environments:` block above.

      # Uncomment to run on a schedule instead of manually. In `dev` the
      # bundle pauses schedules automatically (mode: development), so this
      # only takes effect in staging/prod.
      # schedule:
      #   quartz_cron_expression: "0 0 6 * * ?"   # daily 06:00 UTC
      #   timezone_id: "UTC"
      #   pause_status: UNPAUSED

      email_notifications:
        on_failure:
          - ${var.notification_email}
