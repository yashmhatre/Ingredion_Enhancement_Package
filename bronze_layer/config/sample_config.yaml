# Sample config for bronze_ingest
# Any Spark-readable path works: abfss://, s3://, gs://, dbfs:/, /Volumes/..., file:/
source_path: "/Volumes/ingredion_en/ingredion_dev/ext-ingredion-dev/orders.json"
multiline: true
# schema_hint_ddl: "id STRING, customer STRUCT<name: STRING, email: STRING>"
reader_options: {}

catalog: "ingredion_en"
schema_name: "ingredion_dev"
table: "orders_raw"
write_mode: "append"           # append | overwrite | merge
# merge_keys: ["order_id"]
merge_schema: true

# --- Table layout: liquid clustering (recommended) vs. partition_by (legacy) ---
# cluster_by: ["order_id"]       # liquid clustering - mutually exclusive with partition_by
# cluster_by_auto: true          # CLUSTER BY AUTO - Databricks Runtime only, lets predictive
                                 # optimization pick clustering keys automatically
partition_by: null              # discouraged for new tables - prefer cluster_by; kept for
                                 # backward compat with existing hive-partitioned tables
# table_properties:
#   delta.enableChangeDataFeed: "true"

# --- Catalog documentation: applied post-write, only when changed ---
# table_comment: "Raw orders landed from SAP, one row per source record"
# column_comments:                # top-level columns only - nested paths like
#   order_id: "Source system primary key"        # customer.name are skipped with a
#   customer_email: "Email as provided upstream"  # warning, since bronze doesn't flatten

add_audit_columns: true
audit_ingest_ts_col: "_ingested_at"
audit_source_file_col: "_source_file"
audit_batch_id_col: "_batch_id"
# batch_id: "manual-batch-001"

# --- Data quality ---
required_columns: []            # e.g. ["order_id", "customer_id"]
# unique_columns: ["order_id"]  # combination must be unique within a batch;
                                # duplicates are quarantined/failed like null violations.
                                # Set dedupe_order_by to a SOURCE column to pick which row wins.
fail_on_quality_error: true      # false = quarantine bad rows instead of failing the job
# quarantine_table: "main.bronze.orders_raw_quarantine"

# --- Reliability ---
retry_attempts: 3
retry_delay_seconds: 10.0

# --- Incremental (Auto Loader) ingestion - only used when ingestion_mode: streaming ---
# ingestion_mode: "streaming"
# checkpoint_location: "/Volumes/main/bronze/_checkpoints/orders_raw"
# schema_location: "/Volumes/main/bronze/_schemas/orders_raw"
# schema_evolution_mode: "addNewColumns"   # addNewColumns | rescue | failOnNewColumns | none
# rescued_data_column: "_rescued_data"
# max_files_per_trigger: 1000
# trigger_mode: "availableNow"             # availableNow | once | processingTime
# trigger_processing_time: "30 seconds"    # required if trigger_mode == processingTime
