name: CI

# Every branch in the promotion chain, not just main. Code reaches main
# only via dev -> staging, so running CI on main alone would leave both
# earlier gates unchecked - and any branch protection naming `test` or
# `wheel` as a required status check would block PRs there forever,
# waiting on a run that never starts.
#
# Deliberately NOT using GitHub's native `paths:` filter to skip doc-only
# changes. A path-filtered workflow does not run at all, so a required
# status check never reports and the PR blocks forever - the same deadlock
# the branch list above avoids. Instead every job always runs and always
# reports; each detects whether files it actually depends on changed, and
# skips only its expensive steps. A docs-only PR finishes in seconds with
# all three checks green.
on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: the change detection below diffs against the base
          # branch, which a shallow clone cannot reach.
          fetch-depth: 0

      - name: Detect whether tested code changed
        id: changes
        env:
          # Paths the pytest suite actually depends on.
          #
          # `notebooks/` and `resources/` are watched as of #157, and the
          # comment that used to sit here - "notebooks and sample YAML are
          # excluded, no test reads them" - was accurate and was the problem.
          # notebooks/ holds the deployed job entrypoints, both known live
          # production defects (#144, #145) were there, and neither could ever
          # have been caught while CI did not look at the path. tests/
          # test_notebooks.py now reads both directories, including a contract
          # test that parses resources/*.yml against the widget declarations.
          #
          # pytest.ini was folded into pyproject.toml (#158), which now also
          # carries the pytest config, so it is watched in its place.
          WATCHED: '^bronze_layer/(bronze_ingest|tests|notebooks|resources)/|^bronze_layer/(setup\.py|pyproject\.toml)$|^\.github/workflows/ci\.yml$'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            # New branch, force-push, or unreachable base - run everything
            # rather than guess. Skipping is an optimisation; never let it
            # cause a miss.
            CHANGED=""
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base - running the full suite."
            exit 0
          fi

          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE "$WATCHED"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Tested code changed - running the suite."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No tested code changed - skipping the suite."
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Java (required by PySpark)
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-java@v6.0.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e ".[dev]"
          pip install pytest-json-report pytest-cov playwright
          playwright install --with-deps chromium

      # Coverage is REPORTED, not enforced (#158). No --cov-fail-under: a
      # threshold picked before the real number is known is either trivially
      # met or immediately red, and neither is informative. Add one once the
      # number has been watched for a few runs.
      - name: Run tests
        id: pytest
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          pytest -v --json-report --json-report-file=report.json \
            --cov=bronze_ingest --cov-report=term-missing --cov-report=json:coverage.json
        continue-on-error: true

      - name: Summarise coverage
        id: coverage
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("coverage.json")
          if not p.exists():
              print("pct=n/a")
              print("line=_Coverage unavailable - the suite did not finish._")
              raise SystemExit
          d = json.loads(p.read_text())
          pct = d["totals"]["percent_covered"]
          rows = sorted(
              (
                  (f.replace("\\", "/").split("/")[-1],
                   s["summary"]["percent_covered"],
                   s["summary"]["num_statements"])
                  for f, s in d["files"].items()
              ),
              key=lambda r: r[1],
          )[:5]
          print(f"pct={pct:.1f}")
          body = " / ".join(f"`{n}` {p:.0f}%" for n, p, _ in rows)
          print(f"line=**Coverage {pct:.1f}%** - least covered: {body}")
          PY

      - name: Render report card
        id: render
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          python ../.github/scripts/render_test_report.py \
            report.json test-report-card.png \
            --pr "${{ github.event.pull_request.number || 'n/a' }}" \
            --sha "${{ github.sha }}" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --run-id "${{ github.run_id }}" \
            --timestamp "$(date -u '+%Y-%m-%d %H:%M UTC')"

      - name: Upload report card
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-report-card
          path: |
            bronze_layer/test-report-card.png
            bronze_layer/test-report-card.html

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.changes.outputs.run == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: test-results
          message: |
            ${{ steps.render.outputs.ok == 'true' && '✅ **All tests passed**' || '❌ **Tests failed**' }}

            | Passed | Failed | Skipped | Total | Duration |
            |-------:|-------:|--------:|------:|---------:|
            | ${{ steps.render.outputs.passed }} | ${{ steps.render.outputs.failed }} | ${{ steps.render.outputs.skipped }} | ${{ steps.render.outputs.total }} | ${{ steps.render.outputs.duration }}s |

            ${{ steps.coverage.outputs.line }}

            📊 [**View full visual report**](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — per-file breakdown and failure details on the run summary, plus a downloadable report card image.

      # Replaces the results table rather than leaving a stale one from an
      # earlier commit on the same PR, which would otherwise look like the
      # suite had run against this commit.
      - name: Comment on PR (suite skipped)
        if: github.event_name == 'pull_request' && steps.changes.outputs.run != 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: test-results
          message: |
            ⏭️ **Test suite skipped** — no changes under `bronze_layer/bronze_ingest/`, `bronze_layer/tests/`, `bronze_layer/notebooks/`, `bronze_layer/resources/`, `setup.py`, `pyproject.toml`, or the CI workflow.

            The suite last ran against the most recent commit that touched those paths. Push a change to any of them to re-run it.

      - name: Fail if tests failed
        if: steps.changes.outputs.run == 'true' && steps.render.outputs.ok != 'true'
        run: exit 1

  # The bundle installs bronze_ingest onto job compute as a wheel
  # (databricks.yml `artifacts:` -> task `libraries:`), and the notebooks
  # import it with no sys.path fallback. A wheel that fails to build, ships
  # the wrong files, or reports a version that disagrees with its filename
  # would only surface at deploy time - so it's checked here instead.
  wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether packaged code changed
        id: changes
        env:
          # Narrower than the test job: tests/ do not affect the wheel, and
          # are excluded from it by design. pyproject.toml IS watched here -
          # unlike pytest.ini before it, it declares the build backend, so a
          # change to it can break the wheel (#158).
          WATCHED: '^bronze_layer/bronze_ingest/|^bronze_layer/(setup\.py|pyproject\.toml)$|^\.github/workflows/ci\.yml$'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base - building the wheel."
            exit 0
          fi

          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE "$WATCHED"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Packaged code changed - building the wheel."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No packaged code changed - skipping the wheel build."
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          # Deliberately the SAME command databricks.yml's `artifacts.build`
          # runs, so CI verifies the wheel the deploy actually produces. When
          # these drifted, CI built with `build` while a deploy from Databricks
          # compute had no `build` to run - green CI, failed deploy.
          # `build` is not installed here for the same reason: if this step
          # needs it, the deploy would too.
          python -m pip install --upgrade pip setuptools
          python -m pip wheel . --no-deps --no-build-isolation -w dist

      - name: Verify wheel contents and version
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          python - <<'PY'
          import glob, re, sys, zipfile

          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          failures = []

          # Tests and other stray packages must not ship to production compute.
          leaked = [n for n in names if n.startswith(("tests/", "notebooks/", "config/"))]
          if leaked:
              failures.append(f"non-package files in wheel: {leaked}")

          if not any(n == "bronze_ingest/__init__.py" for n in names):
              failures.append("bronze_ingest/__init__.py missing from wheel")

          # The filename version and the package's own __version__ must agree,
          # or a deployed job can't report which version it is running.
          declared = re.search(
              r'^__version__ = ["\']([^"\']+)["\']',
              open("bronze_ingest/__init__.py").read(), re.M,
          ).group(1)
          if declared not in whl:
              failures.append(f"__version__ {declared!r} not in wheel filename {whl!r}")

          if failures:
              print("\n".join(f"FAIL: {f}" for f in failures))
              sys.exit(1)
          print(f"OK: {whl} ({len(names)} entries), version {declared}")
          PY

      - name: Verify wheel installs and imports standalone
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          python -m venv /tmp/wheelcheck
          # pyspark is intentionally not a runtime dependency (Databricks
          # provides it), so it's installed here to mirror job compute.
          /tmp/wheelcheck/bin/pip install --quiet "pyspark>=3.3.0" dist/*.whl
          cd /tmp && /tmp/wheelcheck/bin/python -c "
          import bronze_ingest
          assert 'site-packages' in bronze_ingest.__file__, bronze_ingest.__file__
          from bronze_ingest import (
              BronzeIngestion, IngestionConfig, ingest_directory_to_bronze,
              reprocess_quarantine, apply_catalog_metadata, get_logger,
          )
          print('wheel imports cleanly:', bronze_ingest.__version__)
          "

  # Static gates that catch a problem before a test would (#158). Deliberately
  # a separate job: it needs no Java, no Spark and no Databricks, so it
  # finishes in seconds and reports independently of the 5-minute test job.
  #
  # Same change-detection shape as the other two, for the same reason - a
  # path-filtered workflow never reports, and a required status check that
  # never reports blocks the PR forever.
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether linted code changed
        id: changes
        env:
          # Notebooks ARE watched here, unlike the test job. They are the
          # deployed entrypoints, and #157 records that both known live
          # defects were in that layer precisely because nothing looked at it.
          WATCHED: '^bronze_layer/(bronze_ingest|tests|notebooks)/|^bronze_layer/(setup\.py|pyproject\.toml)$|^scripts/(hooks/|configure_agent_skills\.py$|generate_codex_agents\.py$|test_configure_agent_skills\.py$|test_generate_codex_agents\.py$)|^\.codex/|^\.github/workflows/ci\.yml$'
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          elif [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && \
               git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            CHANGED=$(git diff --name-only "${{ github.event.before }}" HEAD)
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "No usable diff base - running all quality gates."
            exit 0
          fi

          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'
          if echo "$CHANGED" | grep -qE "$WATCHED"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Linted code changed - running the quality gates."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No linted code changed - skipping the quality gates."
          fi

      - name: Set up Python
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install quality tooling
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: |
          # setuptools is upgraded explicitly, not incidentally. The runner
          # image ships 79.0.1, which carries PYSEC-2026-3447, and pip-audit
          # below fails the build on it - correctly. It is a real build
          # dependency (pyproject's build-system requires it), so the fix is
          # to upgrade rather than to add an --ignore-vuln exception.
          python -m pip install --upgrade pip setuptools
          pip install ruff==0.16.0 mypy==2.3.0 bandit==1.9.4 pip-audit==2.10.1
          # mypy needs the package's own imports resolvable to check call
          # signatures; without this every bronze_ingest import is Any and
          # call-arg silently stops working.
          pip install -e ".[dev]"

      # Orchestrator write-lockdown hook. Deliberately ungated: it guards who
      # may edit implementation code, it needs no dependencies, and it runs in
      # about a second. The first version of this hook shipped failing open on
      # every Windows-shaped path and nothing caught it, because CI's pytest
      # suite runs under bronze_layer/ and never sees scripts/.
      - name: hook lockdown tests
        if: '!cancelled()'
        run: python3 scripts/hooks/test_block_orchestrator_writes.py

      # Path ownership is the *enforcing* half of the write-lockdown rules.
      # The PreToolUse hook above can only ever be advisory: it lives inside
      # one vendor's agent runtime, matches an agent_type that exists nowhere
      # else, and silently never loads when a session starts from the wrong
      # directory -- which is exactly what happened on the primary dev machine
      # for the hook's entire life. This check runs on the commit, so it binds
      # Claude, Copilot and a human editing by hand alike.
      - name: path ownership tests
        if: '!cancelled()'
        run: python3 scripts/test_check_path_ownership.py

      - name: agent skill alias tests
        if: '!cancelled()'
        run: python3 scripts/test_configure_agent_skills.py

      - name: Codex agent renderer tests
        if: '!cancelled()'
        run: python3 scripts/test_generate_codex_agents.py

      - name: path ownership check
        if: "!cancelled() && github.event_name == 'pull_request'"
        run: python3 scripts/check_path_ownership.py --base "origin/${{ github.base_ref }}"

      # Each gate runs even if an earlier one failed, so one PR gets the full
      # picture instead of one finding per push.
      - name: ruff format
        if: steps.changes.outputs.run == 'true'
        working-directory: bronze_layer
        run: ruff format --check --diff bronze_ingest tests notebooks

      - name: ruff lint
        if: '!cancelled() && steps.changes.outputs.run == ''true'''
        working-directory: bronze_layer
        run: ruff check --output-format=github bronze_ingest tests notebooks

      - name: mypy
        if: '!cancelled() && steps.changes.outputs.run == ''true'''
        working-directory: bronze_layer
        run: mypy bronze_ingest notebooks

      - name: bandit
        if: '!cancelled() && steps.changes.outputs.run == ''true'''
        working-directory: bronze_layer
        run: bandit -r bronze_ingest

      # A CVE in a dependency legitimately blocks until someone triages it.
      # If a finding turns out not to apply, add `--ignore-vuln <ID>` here
      # with a comment saying why - do not delete the step.
      - name: pip-audit
        if: '!cancelled() && steps.changes.outputs.run == ''true'''
        working-directory: bronze_layer
        run: pip-audit --progress-spinner off --skip-editable

      # There is deliberately NO `databricks bundle validate` step here (#244).
      #
      # One lived here, non-blocking, on the premise that "validate is a local
      # operation - it resolves the bundle and checks its shape, so it does not
      # need a workspace." That premise is false, and the plan attached to it
      # ("if it proves stable across a few runs, make it a real gate") could
      # never be reached: it failed on 100% of runs, for auth, never once for a
      # bundle error.
      #
      # Measured before removing it, so this does not get re-litigated from
      # memory: `bundle validate` unconditionally calls
      # `GET /api/2.0/preview/scim/v2/Me` and cannot run without credentials.
      #   - CLI v1.9.0, no credentials, `-t dev`     -> "cannot configure default credentials"
      #   - same, `-t staging` (no ${workspace.current_user}, explicit root_path)
      #                                              -> identical failure
      #   - dummy DATABRICKS_HOST + DATABRICKS_TOKEN -> 403 on scim/v2/Me
      # So this is not an unpinned-`@main` regression that pinning would fix,
      # and it is not specific to `dev`'s `mode: development`. No target and no
      # CLI version validates credential-free. Do not re-add this step with a
      # pinned CLI, a different target, or placeholder credentials - all three
      # were tried.
      #
      # What was lost: bundle errors (#118, #122 - a bad reference, a notebook
      # path that does not exist) now reach `dev` without CI objecting. That is
      # a real gap, and it is the same gap that existed before, because a step
      # that reported identically whether the bundle was valid or broken was
      # never closing it.
      #
      # The way to actually close it is a credential in CI - a service
      # principal and repository secrets - which is Tier 2/3 and belongs with
      # #113's OIDC federation, not here. Until then, run it locally against an
      # authenticated profile when touching databricks.yml or
      # bronze_layer/resources/*.yml:
      #
      #   databricks bundle validate -t dev --profile <your-profile>
