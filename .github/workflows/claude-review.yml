name: Claude PR Review

# Reviews the code itself — the thing CI cannot do. CI proves the tests pass;
# this looks for the bugs no test was written for.
on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Run automatically on PRs, or on demand when someone comments "@claude".
    if: |
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Claude can diff against the base branch

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Keep runs bounded — prevents a runaway loop from burning credits.
          claude_args: "--max-turns 8"
          prompt: |
            Review this pull request against the base branch.

            This is a PySpark data-ingestion package for Databricks. Read
            CLAUDE.md and REVIEW.md at the repo root first if they exist, and
            follow their guidance on what counts as important.

            Focus on correctness bugs a test would not catch:
              - Delta write semantics: merge conditions, null-key handling,
                duplicate keys within a batch, first-load races
              - Idempotency: is this safe when a job retries or a file is
                re-ingested?
              - Serverless constraints: .cache()/.persist() are unavailable
              - Silent data loss or silent schema evolution
              - Spark actions triggering extra full scans of the source

            Post your findings as a PR comment, grouped by severity
            (Important / Nit / Pre-existing). If you find nothing important,
            say so plainly in one line rather than inventing filler findings.
            Do not comment on style that CI linting already enforces.
