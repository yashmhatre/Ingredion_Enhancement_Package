# Dependency updates (#158).
#
# `target-branch: dev` on every ecosystem, and it is load-bearing rather
# than tidy. Dependabot defaults to the repository's DEFAULT branch, which
# here is `main` - the END of the promotion chain, not the start. Left at
# the default it opened #190 and #191 directly against `main`, so those
# updates existed in production and in neither `dev` nor `staging`, and the
# next `dev -> staging -> main` promotion would have presented them as
# REVERSIONS.
#
# Everything else in this repo flows dev -> staging -> main. Dependency
# updates have to enter at the same end as every other change, or the
# promotion chain stops being the only way code reaches production.
#
# Grouped and monthly rather than individual and weekly. This repo has a
# small dependency surface and a 5-minute test job, so a PR per dependency
# per week would cost more review attention than it buys - and a review
# queue nobody reads is worse than no automation, because it looks handled.

version: 2
updates:
  # `actions/checkout@v4` and friends drift, and a pinned-by-major action is
  # not pinned to anything reproducible.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # pyspark and delta-spark are DELIBERATELY loose in setup.py: the
  # Databricks runtime provides both, and pinning a version here that
  # disagrees with the runtime's is how a job breaks on compute nobody
  # changed. Dependabot is scoped to security updates only for that reason -
  # it should tell us about a CVE, not try to move a floor that exists to
  # stay compatible with whatever DBR ships.
  - package-ecosystem: "pip"
    directory: "/bronze_layer"
    target-branch: "dev"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      python-packages:
        patterns: ["*"]
    commit-message:
      prefix: "deps"
