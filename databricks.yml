# Root Asset Bundle for the whole repository.
#
#   databricks bundle deploy -t dev        # deploys as you, schedules paused
#   databricks bundle deploy -t staging    # requires --var overrides, see below
#   databricks bundle deploy -t prod       # requires --var overrides, see below
#
# One bundle, not one per layer. bronze_layer and silver_layer previously
# carried their own databricks.yml, which meant the workspace host, the
# target list, and the run-as service principal were declared twice and
# could drift apart. A single root bundle defines them once; each layer
# contributes only its own resources via `include:` below. It also makes
# CI deployment a single `bundle deploy` rather than one per layer, so the
# layers can never be deployed against mismatched settings.
#
# Environments are separated by Unity Catalog SCHEMA and by the service
# principal jobs run as - not by workspace, and not by catalog. One
# workspace, one catalog (ingredion_en), one schema and one service
# principal per environment. That gives per-environment isolation and audit
# without paying for multiple workspaces.
#
# Because the boundary is the schema, every grant that matters is a schema
# grant. `USE CATALOG` on its own conveys no data access, which is what makes
# a shared catalog sound - but it also means a single `GRANT SELECT ON
# CATALOG` would flatten the whole boundary in one statement. Grant
# `USE CATALOG` and nothing else at catalog level.
#
# The audit and schema-registry tables live in each environment's own data
# schema, so the same grant that lets a service principal write its bronze
# tables also covers them - no separate governance schema, and nothing extra
# to grant or keep in sync.
#
# `run_as_service_principal` is set explicitly per target rather than passed
# via --var, so a prod deploy cannot accidentally run under the staging
# identity. Client IDs are identifiers, not credentials, and are safe here.
#
# Known gap: all three environments read subpaths of ONE volume, and Unity
# Catalog grants READ VOLUME at volume granularity - there is no sub-path
# grant. Any principal that can read its own subpath can read PROD/Raw/.
# Tables, audit and registry are isolated by schema; source files are not.
# Per-environment volumes would close it. See bronze_layer/README.md.

bundle:
  name: ingredion_enhancement_package

include:
  - bronze_layer/resources/*.yml
  # silver_layer has no deployable resources yet (it's a stub plus the
  # archived flattener). Uncomment once silver_layer/resources/ contains
  # at least one .yml - an include pattern matching zero files is an error.
  # - silver_layer/resources/*.yml

# The package is built into a wheel and uploaded on every deploy, then
# installed onto job compute via each task's `libraries:`. This replaces
# appending a hardcoded /Workspace/Users/<person> path to sys.path inside
# each notebook: the wheel is versioned, tied to no individual's home
# directory, and rolls back with the bundle.
artifacts:
  bronze_ingest_wheel:
    type: whl
    path: ./bronze_layer
    build: python -m build --wheel

variables:
  catalog:
    description: >-
      Unity Catalog catalog. All three environments share one catalog
      (ingredion_en); isolation is enforced at the SCHEMA level below,
      not the catalog level. `USE CATALOG` on its own grants no data access,
      so this is sound - but it does mean every grant that matters is a
      schema or volume grant. See the isolation notes in
      bronze_layer/README.md.
  schema_name:
    description: >-
      Target schema - this is the environment boundary. Each service
      principal is granted USE SCHEMA / CREATE TABLE on its own schema only.
  source_volume_path:
    description: UC Volume path containing the source JSON files.
  audit_schema_name:
    description: >-
      Schema for the run-level audit table. Must track schema_name: left at
      its package default ("bronze") all three environments would write audit
      rows to one shared table, mixing their trails and handing every service
      principal read access to the others' run history.
  registry_schema_name:
    description: >-
      Schema for the schema-registry table. Same reasoning as
      audit_schema_name.
  env_suffix:
    description: >-
      Short environment tag appended to deployed job display names
      (dev / stg / prd). All three targets deploy into the same workspace, so
      without it the Jobs list shows identically-named jobs and there is no
      way to tell which one is production. The resource key is unsuffixed, so
      `bundle run <key> -t <target>` is unaffected.
  notification_email:
    description: >-
      Address alerted on job failure. Intentionally has no default for
      staging/prod - every environment must name an accountable owner.
  run_as_service_principal:
    description: >-
      Application (client) ID of the Entra ID service principal jobs run as.
      An identifier, not a credential - safe to keep in the repository. Set
      explicitly per target below rather than passed via --var, so a prod
      deploy cannot accidentally run under the staging identity.

targets:
  # A full development environment on Databricks - same code path, same
  # bundle, same Unity Catalog semantics as staging/prod. Local pytest stays
  # the fast inner loop for logic (130 tests, ~3 min, no workspace
  # round-trip), but it cannot reproduce the UC surface (Volumes, tags, Auto
  # Loader, information_schema), so it complements this environment rather
  # than replacing it.
  #
  # mode: development prefixes every resource with the deploying user's name
  # and force-pauses schedules, so concurrent deploys by different people
  # don't collide and nothing runs on a timer by accident.
  dev:
    mode: development          # prefixes resources per-user, pauses schedules
    default: true
    workspace:
      host: https://adb-7405607398572130.10.azuredatabricks.net
    variables:
      catalog: ingredion_en
      schema_name: ingredion_dev
      env_suffix: dev
      audit_schema_name: ingredion_dev
      registry_schema_name: ingredion_dev
      source_volume_path: /Volumes/ingredion_en/ingredion_dev/ext-ingredion-dev/DEV/Raw/
      # Dev alerts go to whoever deployed - no hardcoded address, and no
      # shared inbox getting noise from someone else's experiment.
      notification_email: ${workspace.current_user.userName}
      # dev has no run_as - it deploys as the user, by design. But the CLI
      # requires *every* declared variable to resolve before it will
      # validate or deploy a target, even variables that target never
      # references, so this needs an inert value rather than being left
      # unset. Verified against CLI v1.9.0: leaving it out fails with
      # "no value assigned to required variable run_as_service_principal"
      # on `bundle validate -t dev`.
      #
      # Deliberately not a top-level default: staging and prod must keep
      # failing fast when it isn't supplied, rather than inheriting a
      # placeholder and silently deploying under the wrong identity.
      run_as_service_principal: not-used-in-dev
    # No run_as block here: dev deploys run as the deploying user by design.

  staging:
    mode: production
    workspace:
      host: https://adb-7405607398572130.10.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ingredion_en
      schema_name: ingredion_stg
      env_suffix: stg
      audit_schema_name: ingredion_stg
      registry_schema_name: ingredion_stg
      source_volume_path: /Volumes/ingredion_en/ingredion_dev/ext-ingredion-dev/STG/Raw/
      # Alerts for this environment. A shared alias (e.g. data-platform-oncall@)
      # is preferable once more than one person is on call - an individual's
      # address means failure alerts stop reaching anyone if that mailbox goes
      # away. Lower stakes than run_as, which was a permissions problem: this
      # only decides where alerts land, not what the job can do.
      notification_email: yashmhatre26@gmail.com
      # staging-databricks-service-principal (Entra ID application ID).
      run_as_service_principal: 6ea945e0-2b4f-4746-b8f7-e7be51adc35a
    run_as:
      service_principal_name: ${var.run_as_service_principal}

  prod:
    mode: production
    workspace:
      # Shared, not a personal home directory: production artifacts must not
      # depend on any individual's account continuing to exist.
      host: https://adb-7405607398572130.10.azuredatabricks.net
      root_path: /Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: ingredion_en
      schema_name: ingredion_prd
      env_suffix: prd
      audit_schema_name: ingredion_prd
      registry_schema_name: ingredion_prd
      source_volume_path: /Volumes/ingredion_en/ingredion_dev/ext-ingredion-dev/PROD/Raw/
      # Alerts for this environment. A shared alias (e.g. data-platform-oncall@)
      # is preferable once more than one person is on call - an individual's
      # address means failure alerts stop reaching anyone if that mailbox goes
      # away. Lower stakes than run_as, which was a permissions problem: this
      # only decides where alerts land, not what the job can do.
      notification_email: yashmhatre26@gmail.com
      # prod-sp (Entra ID application ID).
      run_as_service_principal: 8cbc9ba5-b4be-47b7-8a1d-576eb7d1a2e9
    run_as:
      # Production runs as a service principal, never a named human - a job
      # running under a person's identity inherits their full permissions and
      # breaks when they leave.
      service_principal_name: ${var.run_as_service_principal}
